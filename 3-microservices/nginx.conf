# Mirrors services/*/rule.json: each path prefix is forwarded to its own service
server {
  listen 80;

  location /api/users   { proxy_pass http://users:3000; }
  location /api/threads { proxy_pass http://threads:3000; }
  location /api/posts   { proxy_pass http://posts:3000; }
  location /            { proxy_pass http://users:3000; }
}
